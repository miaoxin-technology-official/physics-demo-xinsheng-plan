<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>凸透镜成像</title></head>
<body><h1>凸透镜成像</h1>
<p>物距越大，像距越大，像也越大。</p>
<input id="u" type="range" min="5" max="50" value="20">
<canvas id="c" width="400" height="200"></canvas>
<script>
const u = document.getElementById('u');
const c = document.getElementById('c');
const ctx = c.getContext('2d');
function draw() {
  for (let i = 0; i < 50000; i++) { Math.sqrt(i); }
  const d = Number(u.value);
  ctx.clearRect(0, 0, 400, 200);
  ctx.beginPath(); ctx.moveTo(0, 100); ctx.lineTo(400, 100); ctx.stroke();
  ctx.beginPath(); ctx.arc(200, 100, 30, 0, Math.PI * 2); ctx.stroke();
  const h = 80 - d;
  ctx.beginPath(); ctx.moveTo(60, 100); ctx.lineTo(60, 100 - h); ctx.stroke();
  const v = 200 * d / (d - 20);
  const x = 200 + v * 2;
  ctx.beginPath(); ctx.moveTo(x, 100); ctx.lineTo(x, 100 + h * v / d); ctx.stroke();
}
u.addEventListener('input', draw);
draw();
</script></body></html>
