<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>凸透镜成像</title></head>
<body><h1>凸透镜成像</h1>
<p>物距越大，像距越大，像也越大。</p>
<input id="u" type="range" min="90" max="200" value="120">
<canvas id="c" width="480" height="240"></canvas>
<script>
const u = document.getElementById('u');
const c = document.getElementById('c');
const ctx = c.getContext('2d');
const F = 60, CX = 200, H = 40;
function draw() {
  for (let i = 0; i < 50000; i++) { Math.sqrt(i); }
  const d = Number(u.value);
  const v = F * d / (d - F);
  const hi = H * v / d;
  ctx.clearRect(0, 0, 480, 240);
  ctx.beginPath(); ctx.moveTo(0, 120); ctx.lineTo(480, 120); ctx.stroke();
  ctx.beginPath(); ctx.arc(CX, 120, F / 2, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(CX - d, 120); ctx.lineTo(CX - d, 120 - H); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(CX + v, 120); ctx.lineTo(CX + v, 120 + hi); ctx.stroke();
}
u.addEventListener('input', draw);
draw();
</script></body></html>
