name: PR Agent Review with DeepSeek

# 用 PR-Agent 做只读初审：读 PR、发评论，不改代码、不合并。
# 用 pull_request_target 是为了让 fork PR 也能拿到 DEEPSEEK_API_KEY；
# 因此只检出受信任的 .pr_agent.toml，绝不检出 PR 分支代码。
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout trusted config only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          sparse-checkout: |
            .pr_agent.toml
          sparse-checkout-cone-mode: false

      - name: Run PR Agent
        id: pr_agent
        uses: the-pr-agent/pr-agent@v0.50.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          config.model: "deepseek/deepseek-flash"
          config.fallback_models: '["deepseek/deepseek-flash"]'
          config.max_model_tokens: "32000"
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "false"

      - name: Decide and apply review label
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.issue.number;

            const PASS_LABEL = 'agent-reviewed-pass';
            const WARN_LABEL = 'agent-reviewed-warning';
            const RETURN_LABEL = 'agent-reviewed-return';

            // PR-Agent 的结果是普通 PR 评论
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );

            const reviews = comments.filter((c) =>
              c.user &&
              c.user.type === 'Bot' &&
              /pr-agent:review:full|PR Reviewer Guide/.test(c.body || '')
            );
            const latest = reviews.sort(
              (a, b) => new Date(b.created_at) - new Date(a.created_at)
            )[0];
            const text = latest ? latest.body : '';

            // 只有「AI 判」的 5 级才能直接退回；「AI 提示」的 5 级降为 warning
            const aiJudgeFive = /【L5】\s*【AI判】/.test(text);

            const levels = [...text.matchAll(/【L([1-5])】/g)].map((m) => Number(m[1]));
            const maxLevel = levels.length ? Math.max(...levels) : 0;

            let target;
            if (aiJudgeFive) {
              target = RETURN_LABEL;
            } else if (maxLevel >= 3) {
              target = WARN_LABEL;
            } else {
              target = PASS_LABEL;
            }

            // 只增删这三个状态标签，绝不碰作者或其他人加的标签
            for (const name of [PASS_LABEL, WARN_LABEL, RETURN_LABEL]) {
              if (name === target) continue;
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name });
              } catch (e) {
                if (e.status !== 404) throw e;
              }
            }

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number,
              labels: [target],
            });

            core.info(`AI判5级=${aiJudgeFive} 最高等级=${maxLevel} -> ${target}`);
