name: PR Agent Review with DeepSeek

# 用 PR-Agent 做只读初审：读 PR、发评论，不改代码、不合并。
# 用 pull_request_target 是为了让 fork PR 也能拿到 DEEPSEEK_API_KEY；
# 因此只检出受信任的 .pr_agent.toml，绝不检出 PR 分支代码。
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout trusted config only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          sparse-checkout: |
            .pr_agent.toml
          sparse-checkout-cone-mode: false

      - name: Run PR Agent
        id: pr_agent
        uses: the-pr-agent/pr-agent@v0.50.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          config.model: "deepseek/deepseek-flash"
          config.fallback_models: '["deepseek/deepseek-flash"]'
          config.max_model_tokens: "32000"
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "false"

      - name: Decide and apply review label
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.issue.number;

            const PASS_LABEL = 'agent-reviewed-pass';
            const WARN_LABEL = 'agent-reviewed-warning';
            const RETURN_LABEL = 'agent-reviewed-return';

            // PR-Agent 的结果是以普通 PR 评论发布的，不是行内 review comment
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );

            const reviews = comments.filter((c) =>
              c.user &&
              c.user.type === 'Bot' &&
              /pr-agent:review:full|PR Reviewer Guide/.test(c.body || '')
            );
            // 只取最新一条，避免旧评论里的等级污染本次判定
            const latest = reviews.sort(
              (a, b) => new Date(b.created_at) - new Date(a.created_at)
            )[0];
            const text = latest ? latest.body : '';

            let level = null;

            // 优先读 PR-Agent 输出的汇总行
            const direct = text.match(/REVIEW_MAX_LEVEL:\s*([1-5])/);
            if (direct) level = Number(direct[1]);

            // 其次读每条问题的【L5】标记
            if (level === null) {
              const tags = [...text.matchAll(/【L([1-5])】/g)].map((m) => Number(m[1]));
              if (tags.length) level = Math.max(...tags);
            }

            // 最后兼容中文写法「（5 级阻断）」
            if (level === null) {
              const cn = [...text.matchAll(/[（(]\s*([1-5])\s*级/g)].map((m) => Number(m[1]));
              if (cn.length) level = Math.max(...cn);
            }

            if (level === null) {
              core.warning('没有从 PR-Agent 评论里解析出等级，按 1 级处理');
              level = 1;
            }

            // 5 级 -> return；最高 3-4 级 -> warning；最高 1-2 级 -> pass
            const target =
              level === 5 ? RETURN_LABEL : level >= 3 ? WARN_LABEL : PASS_LABEL;

            for (const name of [PASS_LABEL, WARN_LABEL, RETURN_LABEL]) {
              if (name === target) continue;
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name });
              } catch (e) {
                if (e.status !== 404) throw e;
              }
            }

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number,
              labels: [target],
            });

            core.info(`最高等级 ${level} -> ${target}`);
