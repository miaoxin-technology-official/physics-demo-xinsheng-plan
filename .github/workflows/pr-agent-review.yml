name: PR Agent Review with DeepSeek

# 用 PR-Agent 做只读初审：读 PR、发评论，不改代码、不合并。
# 用 pull_request_target 是为了让 fork PR 也能拿到 DEEPSEEK_API_KEY；
# 因此只检出受信任的 .pr_agent.toml，绝不检出 PR 分支代码。
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout trusted config only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          sparse-checkout: |
            .pr_agent.toml
          sparse-checkout-cone-mode: false

      - name: Run PR Agent
        id: pr_agent
        uses: the-pr-agent/pr-agent@v0.50.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          config.model: "deepseek/deepseek-flash"
          config.fallback_models: '["deepseek/deepseek-flash"]'
          config.max_model_tokens: "32000"
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "false"

      - name: Decide and apply review label
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.issue.number;

            const PASS_LABEL = 'agent-reviewed-pass';
            const RETURN_LABEL = 'agent-reviewed-return';

            // 获取该 PR 的所有行内审查评论
            const comments = await github.paginate(
              github.rest.pulls.listReviewComments,
              { owner, repo, pull_number: issue_number, per_page: 100 }
            );

            // 只统计 Bot 留下的行内评论（PR-Agent 发现问题时会发 inline comment）
            const botComments = comments.filter(c => c.user && c.user.type === 'Bot');
            const hasFindings = botComments.length > 0;

            const addLabel = hasFindings ? RETURN_LABEL : PASS_LABEL;
            const removeLabel = hasFindings ? PASS_LABEL : RETURN_LABEL;

            // 移除旧状态标签，避免同时存在
            try {
              await github.rest.issues.removeLabel({
                owner, repo, issue_number, name: removeLabel
              });
            } catch (e) {
              if (e.status !== 404) throw e;
            }

            // 添加当前状态标签
            await github.rest.issues.addLabels({
              owner, repo, issue_number, labels: [addLabel]
            });

            core.info(`Applied label: ${addLabel}`);
