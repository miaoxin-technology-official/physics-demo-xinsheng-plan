name: AI PR Review

# 只读初审：读 PR 的文件和描述，发一条评论。
# 不检出 PR 代码、不执行 PR 里的任何文件、不改代码、不 approve、不合并。
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  # 只是发评论需要；没有 contents: write，无法推送或合并
  pull-requests: write

concurrency:
  group: ai-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 只检出默认分支来运行检查脚本，绝不检出 PR 分支或合并提交
      - name: 检出默认分支（不碰 PR 代码）
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: 初审并发布评论
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/review-pr.mjs
